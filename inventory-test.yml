---
- name: Inspect AWX inventory
  hosts: web
  gather_facts: false

  tasks:
    - name: Direct environment
      ansible.builtin.debug:
        var: environment

    - name: Environment through hostvars
      ansible.builtin.debug:
        msg: >-
          {{ hostvars[inventory_hostname]['environment'] }}

    - name: Server role
      ansible.builtin.debug:
        var: server_role

    - name: App port
      ansible.builtin.debug:
        var: app_port
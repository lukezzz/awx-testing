---
- name: AWX SSH connectivity test
  hosts: all
  gather_facts: true

  tasks:
    - name: Show inventory hostname
      ansible.builtin.debug:
        msg: "Inventory host = {{ inventory_hostname }}"

    - name: Show target hostname
      ansible.builtin.command:
        cmd: hostname
      register: target_hostname
      changed_when: false

    - name: Display target hostname
      ansible.builtin.debug:
        msg: "Remote hostname = {{ target_hostname.stdout }}"

    - name: Show target OS
      ansible.builtin.debug:
        msg: >-
          {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    - name: Create AWX test file
      ansible.builtin.copy:
        content: |
          Created by AWX
          Inventory host: {{ inventory_hostname }}
          Remote hostname: {{ target_hostname.stdout }}
        dest: /tmp/awx-test.txt
        mode: "0644"
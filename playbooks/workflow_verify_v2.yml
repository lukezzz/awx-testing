---
- name: Verify workflow deployment data
  hosts: web
  gather_facts: false

  tasks:
    - name: Read deployed configuration
      ansible.builtin.slurp:
        src: /tmp/awx-workflow-demo/app.conf
      register: deployed_config

    - name: Decode configuration
      ansible.builtin.set_fact:
        config_content: "{{ deployed_config.content | b64decode }}"

    - name: Show workflow runtime information
      ansible.builtin.debug:
        msg:
          - "deployment_id = {{ deployment_id }}"
          - "deployed_version = {{ deployed_version }}"
          - "environment = {{ deployment_environment }}"

    - name: Verify deployment data
      ansible.builtin.assert:
        that:
          - "'version=' + deployed_version in config_content"
          - "'environment=' + deployment_environment in config_content"
          - "'deployment_id=' + deployment_id in config_content"
        success_msg: >-
          Deployment {{ deployment_id }} verified successfully
        fail_msg: >-
          Deployment {{ deployment_id }} verification failed
---
- name: Cisco NX-OS interface compliance
  hosts: cisco_nxos
  gather_facts: false

  tasks:
    - name: Check expected UP interfaces
      cisco.nxos.nxos_command:
        commands:
          - "show interface {{ item }}"
      loop: "{{ expected_up_interfaces }}"
      register: interface_checks

    - name: Validate expected UP interfaces
      ansible.builtin.assert:
        that:
          - "item.stdout_lines[0][0] is regex('^\\S+ is up$')"
        success_msg: >-
          PASS: {{ item.item }} is operationally UP
        fail_msg: >-
          FAIL: {{ item.item }} is expected UP but is not operationally UP.
          Actual state: {{ item.stdout_lines[0][0] }}
      loop: "{{ interface_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

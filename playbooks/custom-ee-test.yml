---
- name: Test custom execution environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Show Ansible version
      ansible.builtin.command:
        cmd: ansible --version
      register: ansible_version
      changed_when: false

    - name: Display Ansible version
      ansible.builtin.debug:
        var: ansible_version.stdout_lines

    - name: Show installed community.general version
      ansible.builtin.shell:
        cmd: >
          ansible-galaxy collection list |
          grep community.general
      register: collection_version
      changed_when: false

    - name: Display collection version
      ansible.builtin.debug:
        var: collection_version.stdout

    - name: Verify jmespath Python package
      ansible.builtin.command:
        cmd: python3 -c "import jmespath; print(jmespath.__version__)"
      register: jmespath_version
      changed_when: false

    - name: Display jmespath version
      ansible.builtin.debug:
        msg: "jmespath version = {{ jmespath_version.stdout }}"